[project]
name = "agent-clikit"
version = "1.0.0"
description = "Zero-dependency Python reference implementation for agent-cli-spec (clikit)."
readme = "../../README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_clikit"]
