name: Auto-Assign PR

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign:
    name: Assign PR to Owner
    runs-on: ubuntu-latest
    steps:
      - name: Assign repository owner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-assignee "${GITHUB_REPOSITORY_OWNER}"
